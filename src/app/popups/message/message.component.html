<div class="gap-3 p-3 d-flex flex-column rr-card dark h-auto align-items-center">
  <div class="text-center p-4">{{ data.text }}</div>
  <div class="d-flex gap-3">
    @if (data.cancel) {
      <rr-button text="Cancel" color="orange" mat-dialog-close />
    }
    <rr-button text="Ok" color="blue" [mat-dialog-close]="true" />
  </div>
</div>
