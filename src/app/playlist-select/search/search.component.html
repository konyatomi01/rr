<mat-form-field appearance="outline" class="rr-field rr-search search-field my-2" subscriptSizing="dynamic">
  <mat-icon matPrefix>search</mat-icon>
  <input matInput [formControl]="search" placeholder="Search for any playlist!" aria-label="Search playlists" type="search">
  @if (search.value) {
    <button matIconButton matSuffix class="rr-icon-button rr-filled rr-dark clear" (click)="search.setValue('')" aria-label="Clear search">
      <mat-icon>clear</mat-icon>
    </button>
  }
</mat-form-field>
<rr-playlist-grid [playlists]="playlists()" [loading]="state().status === 'loading'" [emptyText]="emptyText()" />
