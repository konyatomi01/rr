<div class="rr-card select-card">
  <rr-party />
  @if (party.showParty()) {
    <rr-party-list />
  } @else if (waitingToAccept()) {
    <div class="waiting d-flex justify-content-center align-items-center flex-grow-1">
      Waiting for other players!
    </div>
  } @else {
    <rr-toggle-button class="my-2" [form]="tabControl" color="red">
      <button toggle-button [value]="tabs.charts">Charts</button>
      <button toggle-button [value]="tabs.search">Search</button>
      <button toggle-button [value]="tabs.custom">
        <div class="warning">{{ party.customPlaylist().length }}</div>
        Custom
      </button>
    </rr-toggle-button>

    @switch (selectedTab()) {
      @case (tabs.search) {
        <rr-search class="px-3" />
        <h1>SELECT A PLAYLIST TO START!</h1>
      }
      @case (tabs.charts) {
        <rr-categories class="px-3" />
        <h1>SELECT A PLAYLIST TO START!</h1>
      }
      @case (tabs.custom) {
        <rr-custom-playlist class="px-3" />
      }
    }
  }
  <rr-button color="orange" text="Join code:" (click)="copyCode()">{{ server.partyId() }}</rr-button>
</div>
