<div class="d-flex w-100">
  <div class="col-6 p-1">
    <button class="action add" (click)="dialog.openAddToPlaylistDialog()">
      <mat-icon class="flex-shrink-0 me-2">add</mat-icon>
      <span>Add song</span>
    </button>
  </div>
  <div class="col-6 p-1">
    <button class="action start" (click)="start()" [class.disabled]="party.customPlaylist().length < minTracks">
      <mat-icon class="flex-shrink-0 me-2">play_arrow</mat-icon>
      <span>Start</span>
    </button>
  </div>
</div>
@if (party.customPlaylist().length) {
  <div class="song-displayer mt-2" [class.isMd]="display.isMd()">
    @for (song of party.customPlaylist(); track song.id) {
      <div class="song p-1">
        <img class="cover" [src]="song.cover" />
        <span class="ms-2">{{ song.title }}</span>
        <div class="flex-grow-1"></div>
        @if (ownSong(song)) {
          <button (click)="removeSong(song)"><mat-icon>clear</mat-icon></button>
        } @else {
          <img [src]="song.player?.pfp" class="player" />
        }
      </div>
    }
  </div>
} @else {
  <div class="d-flex justify-content-center flex-column align-items-center text-center flex-grow-1 gap-4">
    <span>Create your custom playlist together!</span>
    <span>Add any songs from the Deezer catalog to your custom playlist with the Add song button!</span>
  </div>
}
