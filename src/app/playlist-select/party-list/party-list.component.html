<div class="overflow-y-auto row w-100 my-2 flex-grow-1">
  @for (player of party.party(); track player.id) {
    <div class="col-12 col-md-6 col-lg-4 h-min-content">
      <div class="player p-1 w-100 m-1" [class.accepted]="player.accepted">
        <div class="d-flex align-items-center gap-1 h-100">
          <img class="pfp" [src]="player.pfp" />
          @if (player.isLeader) {
            <img class="h-50" src="assets/crown.svg" />
          }
          <span class="name">{{ player.name }}</span>
        </div>
        @if (!player.isLeader && party.player()?.isLeader) {
          <button class="kick-button me-2" (click)="kickPlayer(player)">
            <mat-icon>cancel</mat-icon>
          </button>
        }
      </div>
    </div>
  }
  <div class="filler"></div>
</div>
