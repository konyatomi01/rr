<div class="overflow-y-auto row w-100 my-2 flex-grow-1 align-content-start">
  @for (player of party.players(); track player.id) {
    <div class="col-12 col-md-6 col-lg-4 h-min-content">
      <div class="player p-1 w-100 m-1" [class.accepted]="player.accepted" [class.disconnected]="!player.connected">
        <div class="d-flex align-items-center gap-1 h-100 overflow-hidden">
          <img class="pfp" [src]="player.pfp" alt="">
          @if (player.isLeader) {
            <mat-icon class="crown" svgIcon="crown" aria-label="Leader" />
          }
          <span class="text-truncate">{{ player.name }}</span>
        </div>
        @if (!player.isLeader && party.isLeader()) {
          <button matIconButton class="rr-icon-button kick me-1" (click)="kickPlayer(player)" [attr.aria-label]="'Kick ' + player.name">
            <mat-icon>cancel</mat-icon>
          </button>
        }
      </div>
    </div>
  }
</div>
