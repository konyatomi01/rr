<div class="d-flex justify-content-center align-items-center mb-2 gap-3 category-select">
  <mat-icon [class.disabled]="page() === 1" (click)="categoryMinus()">arrow_circle_left</mat-icon>
  <div class="category">{{ page() }} / {{ pageCount }}</div>
  <mat-icon [class.disabled]="page() === pageCount" (click)="categoryPlus()">arrow_circle_right</mat-icon>
</div>
<div class="row playlist-displayer">
  @if (isLoading()) {
    <rr-spinner />
  } @else {
    @for (playlist of playlists(); track playlist.id) {
      <button class="col-3 col-lg-2 pl-button" (click)="playlistClicked(playlist)">
        <img class="cover" [src]="playlist.cover" />
        <figcaption class="caption">{{ playlist.title }}</figcaption>
      </button>
    }
  }
</div>
