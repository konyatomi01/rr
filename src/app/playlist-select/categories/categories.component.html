<div class="d-flex justify-content-center align-items-center mb-2 gap-3 category-select">
  <button matIconButton class="rr-icon-button pager" [disabled]="page() === 1" (click)="go(-1)" aria-label="Previous page">
    <mat-icon>arrow_circle_left</mat-icon>
  </button>
  <div class="category" aria-live="polite">{{ page() }} / {{ pageCount }}</div>
  <button matIconButton class="rr-icon-button pager" [disabled]="page() === pageCount" (click)="go(1)" aria-label="Next page">
    <mat-icon>arrow_circle_right</mat-icon>
  </button>
</div>
<rr-playlist-grid [playlists]="playlists()" [loading]="isLoading()" [emptyText]="emptyText()" />
