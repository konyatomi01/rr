@if (party.player(); as player) {
  <div class="h-100 w100 main-player p-2">
    <img [src]="player.pfp" class="h-100 main-pfp me-2">
    <div>
      <div>
        <div>{{ player.name }}</div>
        <div>{{ player.points }} points</div>
      </div>
      <div class="d-flex h-50">
        @for (index of hearts; track index) {
          <img [src]="index < player.lives ? 'assets/heart-filled.svg' : 'assets/heart.svg'" class="h-75">
        }
      </div>
    </div>
  </div>
}
