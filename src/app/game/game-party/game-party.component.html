<div class="players">
  @for (player of party.party(); track player.id) {
    <div class="player mb-1 ps-1">
      <img [src]="player.pfp" class="pfp">
      <div class="d-flex h-100 details justify-content-between px-1">
        <div>
          <div>{{ player.name }}</div>
          <div>{{ player.points }}p</div>
        </div>
        <div class="d-flex align-items-center h-100">
          @for (index of hearts; track index) {
            <img [src]="index < player.lives ? 'assets/heart-filled.svg' : 'assets/heart.svg'" class="h-50">
          }
        </div>
      </div>
    </div>
  }
</div>

<div [hidden]="party.party().length > 1" class="singleplayer p-3">
  <img src="assets/group.svg" class="h-75 m-2">
  <div>
    <div class="text-center">Don't miss out on the real fun!</div>
    <div class="text-center">Invite your friends and play together!</div>
  </div>
</div>
