<div class="rr-container">
  <div class="mb-2 text-center">
    <img src="assets/logo2223.png" class="logo">
  </div>

  @switch (route.state()) {
    @case ('launch') { <rr-launch /> }
    @case ('select') { <rr-playlist-select /> }
    @case ('game') { <rr-game /> }
    @case ('gameover') { <rr-game-over /> }
    @case ('roundover') { <rr-round-over /> }
  }

  @if (snackBar.show()) {
    <div class="snackbar">{{ snackBar.text() }}</div>
  }
</div>
