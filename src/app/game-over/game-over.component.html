<div class="d-flex justify-content-center">
  <mat-card class="rr-card results">
    <h1 class="text-center mb-1">{{ title() }}</h1>
    @if (reason()) {
      <p class="text-center reason">{{ reason() }}</p>
    }

    <div class="w-100 main-div mb-3">
      @for (entry of ranked(); track entry.player.id) {
        <div class="player-row" [class]="medal(entry.rank)">
          <div class="m-2">{{ entry.rank }}.</div>
          <img [src]="entry.player.pfp" class="rr-pfp me-1" alt="">
          <div class="me-3 name text-truncate">{{ entry.player.name }}</div>
          <div class="text-end me-2 text-nowrap">
            <div>{{ entry.player.rightRounds }}/{{ game.round() }} correct</div>
            <div>{{ entry.player.points }}p</div>
          </div>
        </div>
      }
    </div>

    <div class="d-flex justify-content-center">
      <button matButton="elevated" class="rr-orange" (click)="playAgain()">Play again!</button>
    </div>
  </mat-card>
</div>
